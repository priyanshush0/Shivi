<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dil Se Sorry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;800&family=Caveat:wght@500;700&display=swap">
  <style>
    :root {
      --bg: #0d1230;
      --bg-2: #171d48;
      --ink: #eef0ff;
      --ink-soft: #a9b0dc;
      --tear: #7fd3ff;
      --rose: #ff8fa6;
      --gold: #ffd9a0;
      --line: #2f3875;
      --font-display: 'Young Serif', Georgia, 'Times New Roman', serif;
      --font-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-hand: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem max(16px, env(safe-area-inset-left, 0px));
      background-color: var(--bg);
      background-image:
        radial-gradient(48rem 30rem at 85% 0%, rgba(127, 211, 255, 0.16), transparent 60%),
        radial-gradient(44rem 28rem at 5% 100%, rgba(255, 143, 166, 0.16), transparent 60%);
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* falling "sorry" words, like rain on a window */
    .rain { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .rain span {
      position: absolute;
      top: -2rem;
      left: var(--x);
      font-family: var(--font-hand);
      font-size: var(--s);
      color: var(--tear);
      opacity: 0;
      animation: fall var(--d) linear infinite;
      animation-delay: var(--w);
      white-space: nowrap;
    }
    @keyframes fall {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.5; }
      85% { opacity: 0.3; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    main {
      position: relative;
      width: 100%;
      max-width: 30rem;
      padding: 2.6rem 1.8rem 2.2rem;
      text-align: center;
      background: rgba(23, 29, 72, 0.72);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      animation: rise 0.9s cubic-bezier(.2, .7, .2, 1) backwards;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    .heart {
      width: 4.2rem;
      height: 4.2rem;
      margin: -4.6rem auto 1.2rem;
      padding: 0.9rem;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--line);
      box-shadow: 0 0 0 0.5rem rgba(13, 18, 48, 0.9);
      display: grid;
      place-items: center;
    }
    .heart svg { width: 100%; height: 100%; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.18); } 28% { transform: scale(1); } 42% { transform: scale(1.12); } }

    .eyebrow { margin: 0 0 0.8rem; font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.6rem, 13vw, 3.9rem);
      line-height: 1;
      text-wrap: balance;
    }
    h1 em { color: var(--rose); font-style: italic; }

    p.lead { margin: 1.2rem auto 0; max-width: 24rem; color: var(--ink-soft); }

    .go {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-top: 1.8rem;
      padding: 0.95rem 1.7rem;
      border-radius: 999px;
      background: var(--rose);
      color: #2a0d1a;
      font-weight: 800;
      font-size: 1.02rem;
      text-decoration: none;
      box-shadow: 0 0.8rem 2rem rgba(255, 143, 166, 0.35);
      transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .go svg { width: 1.3rem; height: 1.3rem; flex: none; }
    .go .arrow { transition: transform 0.25s ease; }
    .go:hover { background: #ffa7b9; transform: translateY(-3px); box-shadow: 0 1.1rem 2.4rem rgba(255, 143, 166, 0.45); }
    .go:hover .arrow { transform: translateX(4px); }
    .go:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    .hand { margin: 1.6rem 0 0; font-family: var(--font-hand); font-size: 1.6rem; line-height: 1.15; color: var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      main, .heart svg, .rain span { animation: none; }
      .rain { display: none; }
      .go, .go .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="rain" aria-hidden="true">
    <span style="--x:6%;  --s:1.3rem; --d:11s; --w:0s">sorry</span>
    <span style="--x:16%; --s:1rem;   --d:14s; --w:3s">maaf kar do</span>
    <span style="--x:27%; --s:1.5rem; --d:12s; --w:6s">sorry</span>
    <span style="--x:38%; --s:1.1rem; --d:15s; --w:1s">please</span>
    <span style="--x:49%; --s:1.4rem; --d:10s; --w:8s">sorry</span>
    <span style="--x:60%; --s:1rem;   --d:13s; --w:4s">sorry jaan</span>
    <span style="--x:71%; --s:1.5rem; --d:12s; --w:2s">sorry</span>
    <span style="--x:82%; --s:1.1rem; --d:16s; --w:7s">maaf kar do</span>
    <span style="--x:92%; --s:1.3rem; --d:11s; --w:5s">sorry</span>
  </div>

  <main>
    <div class="heart">
      <svg viewBox="-1.2 -1.2 2.4 2.4" aria-hidden="true"><path fill="#ff8fa6" d="M0 0.6C-1.1 -0.1 -0.6 -1 0 -0.4C0.6 -1 1.1 -0.1 0 0.6Z"/></svg>
    </div>
    <p class="eyebrow">Tumhare liye, ek chhoti si chitthi</p>
    <h1>Dil Se <em>Sorry</em></h1>
    <p class="lead">Kuch kehna tha, par lafz kam pad gaye. Isliye ye chhota sa page banaya hai. Bas ek baar khol ke dekh lo.</p>
    <a class="go" href="Shivi/Dil%20Se%20Sorry.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Sorry page kholo
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="hand">sirf tumhare liye</p>
  </main>
</body> 
</html>
